name: Reika Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test artwork validator
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify JavaScript syntax
        run: |
          for file in prototype/*.js tests/*.js; do node --check "$file"; done
      - name: Unit tests
        run: node --test tests/*.test.js
      - name: Verify HTML scripts exist
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html=fs.readFileSync('prototype/index.html','utf8');
          const scripts=[...html.matchAll(/<script\s+src="([^"]+)"/g)].map(x=>x[1]);
          if (!scripts.length) throw Error('No scripts found');
          for(const src of scripts) if(!fs.existsSync('prototype/'+src))throw Error('Missing script: '+src);
          console.log('Verified',scripts.length,'script references');
          NODE
