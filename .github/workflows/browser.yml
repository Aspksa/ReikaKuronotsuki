name: Browser Smoke Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npx playwright test tests/browser.spec.cjs tests/browser-pivots.spec.cjs tests/browser-physics.spec.cjs tests/browser-secondary.spec.cjs tests/browser-expressions.spec.cjs tests/browser-speech.spec.cjs tests/browser-chat.spec.cjs tests/browser-layer-reliability.spec.cjs tests/browser-tail-composition.spec.cjs tests/browser-tail-editor-v42.spec.cjs tests/browser-tail-editor-v49.spec.cjs tests/browser-tail-motion-v56.spec.cjs --reporter=line
