<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17141d">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<title>Reika Kuronotsuki</title>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="avatar" id="avatar" aria-hidden="true">🦊</div>
    <div class="who">
      <h1>Рэйка Куроноцуки</h1>
      <p id="mood">Спокойствие</p>
    </div>
    <button id="clear" class="ghost" type="button" aria-label="Очистить историю">Очистить</button>
  </header>
  <main id="log" class="log" aria-live="polite"></main>
  <form id="form" class="composer" autocomplete="off">
    <label for="input" class="sr">Сообщение</label>
    <textarea id="input" rows="1" maxlength="2000" placeholder="Напиши Рэйке…" enterkeyhint="send"></textarea>
    <button id="send" type="submit">Отправить</button>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
